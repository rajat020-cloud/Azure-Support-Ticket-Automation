name: CI — Build, Typecheck & Automated Tests

on:
  push:
    branches: [main, master, '**']
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Backend & Frontend CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 3. Install backend dependencies from lockfile
        working-directory: ./backend
        run: npm ci

      - name: 4. Install frontend dependencies from lockfile
        working-directory: ./frontend
        run: npm ci

      - name: 5. Run backend TypeScript typecheck
        working-directory: ./backend
        run: npm run typecheck

      - name: 6. Run frontend TypeScript typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: 7. Run backend automated tests (Vitest + Supertest)
        working-directory: ./backend
        env:
          NODE_ENV: test
          REVIEWER_API_KEY: ci-test-reviewer-secret
        run: npm test

      - name: 8. Run held-out classifier evaluation check
        working-directory: ./backend
        run: npm run evaluate

      - name: 9. Run frontend automated tests (Vitest + Testing Library)
        working-directory: ./frontend
        run: npm test

      - name: 10. Build backend for production
        working-directory: ./backend
        run: npm run build

      - name: 11. Build frontend for production
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://example-render-backend.onrender.com
        run: npm run build
